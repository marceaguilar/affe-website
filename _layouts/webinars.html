---
layout: default
---

<h1 class="page-title">Webinars</h1>

<div class="webinars-container">
  {{ content }}
</div>

<style>
.webinars-container hr {
  width: 100%;
  max-width: none;
  margin: 3rem 0 2rem;
  border: 0;
  border-top: 2px solid rgba(184, 183, 148, 0.6);
}

.webinars-container h3#methodological-webinars--design-discussions {
  width: 100%;
  max-width: none;
  margin: 0 0 1.5rem;
  font-size: 1.85rem;
  color: var(--color-olivewood);
}

.webinar-featured {
  max-width: 900px;
  margin: 2.5rem auto 3rem;
  padding: 2.25rem 2.5rem;
  border-radius: 14px;
  border: 1px solid rgba(184, 183, 148, 0.6);
  background-color: var(--color-white);
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 2.2fr);
  gap: 2rem;
  align-items: start;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

.webinar-speaker-photo {
  display: flex;
  justify-content: center;
}

.webinar-speaker-photo img {
  width: 210px;
  height: auto;
  border-radius: 10px;
  object-fit: contain;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
}

.webinar-details {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.webinar-date {
  font-weight: 600;
  color: var(--color-text-light);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 0.8rem;
}

.webinar-title {
  font-size: 1.6rem;
  margin: 0.25rem 0 0.75rem;
  color: var(--color-olivewood);
  line-height: 1.3;
}

.webinar-meta {
  margin: 0;
  font-size: 0.98rem;
}

.webinar-meta a {
  color: var(--color-olivewood);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.webinar-meta a:hover {
  color: var(--color-bark);
}

.webinar-abstract {
  margin-top: 0;
  line-height: 1.9;
  font-size: 0.97rem;
}

.webinar-abstract-wrap {
  margin-top: 0.75rem;
}

.webinar-abstract.is-collapsed {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.webinar-abstract-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.65rem;
  padding: 0;
  border: none;
  background: none;
  color: var(--color-bark);
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.2s ease;
}

.webinar-abstract-toggle:hover {
  color: var(--color-olivewood);
}

.webinar-abstract-toggle-icon {
  transition: transform 0.2s ease;
}

.webinar-abstract-toggle[aria-expanded="true"] .webinar-abstract-toggle-icon {
  transform: rotate(180deg);
}

@media (max-width: 900px) {
  .webinar-featured {
    grid-template-columns: minmax(0, 1fr);
    padding: 2rem 1.75rem;
  }

  .webinar-speaker-photo img {
    width: 160px;
    height: 160px;
  }
}
</style>
