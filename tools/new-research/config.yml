# ---------------------------------------------------------------------------
# AFFE "New Research" feed configuration
#
# This file is the ONLY place you should need to edit to change what the
# /new-research page tracks. After editing, re-run:
#
#     python3 tools/new-research/build.py
#
# ---------------------------------------------------------------------------

# Contact address sent to the OpenAlex and Crossref "polite pools". Using a
# real address gets us faster, more reliable rate limits. Do not remove.
contact_email: "affe-committee@googlegroups.com"

# How far back to look on each run, in days.
# Journals are slower to index than SSRN, so we use a wider window and then
# de-duplicate against whatever is already in the feed.
lookback_days:
  journals: 400
  ssrn: 120

# Maximum number of entries kept in the published feed.
max_items: 300

# Entries older than this (by year) are dropped even if they are still inside
# the lookback window. Set to null to disable.
min_year: 2024

# ---------------------------------------------------------------------------
# Detection: what counts as a field experiment
# ---------------------------------------------------------------------------
# A paper is only kept if its title or abstract contains one of these exact
# phrases (case-insensitive, matched on word boundaries). Keep these tight:
# loosening them is the fastest way to fill the page with noise.
field_experiment_phrases:
  - "field experiment"
  - "field experiments"
  - "randomized controlled trial"
  - "randomised controlled trial"
  - "randomized control trial"
  - "randomized field trial"
  - "randomized evaluation"
  - "randomised evaluation"
  - "cluster randomized"
  - "cluster randomised"
  - "natural field experiment"
  - "framed field experiment"
  - "audit study"
  - "correspondence study"
  - "correspondence experiment"
  - "randomized experiment"
  - "randomised experiment"
  - "rct"

# Phrases that, when matched ALONE, are too weak to keep a paper. They must be
# accompanied by one of the strong phrases above plus a discipline signal.
weak_phrases:
  - "rct"
  - "randomized experiment"
  - "randomised experiment"

# ---------------------------------------------------------------------------
# Discipline gate
# ---------------------------------------------------------------------------
# SSRN hosts every discipline, and "field experiment" is standard vocabulary in
# agronomy, ecology and engineering. A non-journal paper must match at least
# one discipline keyword and must not match the exclusion vocabulary.
discipline_keywords:
  accounting:
    - "accounting"
    - "auditor"
    - "audit fee"
    - "audit quality"
    - "financial reporting"
    - "disclosure"
    - "earnings"
    - "tax compliance"
    - "tax filing"
    - "taxpayer"
    - "internal control"
    - "management control"
    - "investor relations"
    - "analyst"
    - "bookkeeping"
    - "xbrl"
  finance:
    - "finance"
    - "financial"
    - "investor"
    - "investment"
    - "bank"
    - "banking"
    - "credit"
    - "loan"
    - "lending"
    - "borrower"
    - "microfinance"
    - "insurance"
    - "savings"
    - "portfolio"
    - "stock market"
    - "equity"
    - "crowdfunding"
    - "fintech"
    - "mortgage"
    - "remittance"
    - "debt"
    - "financial literacy"
    - "retirement"
    - "pension"
  economics:
    - "economic"
    - "economics"
    - "labor market"
    - "labour market"
    - "wage"
    - "employment"
    - "unemployment"
    - "household"
    - "poverty"
    - "welfare"
    - "development economics"
    - "public policy"
    - "tax"
    - "subsidy"
    - "voucher"
    - "cash transfer"
    - "willingness to pay"
    - "price"
    - "demand"
    - "productivity"
    - "microenterprise"
    - "entrepreneur"
    - "discrimination"
    - "behavioral economics"
    - "behavioural economics"
  management:
    - "management"
    - "manager"
    - "firm"
    - "firms"
    - "organization"
    - "organisation"
    - "workplace"
    - "employee"
    - "worker"
    - "hiring"
    - "recruitment"
    - "marketing"
    - "consumer"
    - "customer"
    - "advertising"
    - "e-commerce"
    - "platform"
    - "supply chain"
    - "operations management"
    - "strategy"
    - "startup"
    - "gig economy"
    - "human resource"

# Any paper whose title or abstract matches one of these is dropped outright.
# These are the recurring false positives from SSRN's science preprints.
exclusion_keywords:
  - "soil"
  - "crop"
  - "maize"
  - "wheat"
  - "soybean"
  - "rice yield"
  - "fertilizer"
  - "fertiliser"
  - "irrigation"
  - "agronomic"
  - "agronomy"
  - "intercropping"
  - "tillage"
  - "cultivar"
  - "seedling"
  - "livestock feed"
  - "photosynthesis"
  - "biochar"
  - "groundwater"
  - "aquifer"
  - "wastewater"
  - "combustion"
  - "gasifier"
  - "concrete"
  - "asphalt"
  - "corrosion"
  - "turbine"
  - "photovoltaic"
  - "nanoparticle"
  - "catalyst"
  - "polymer"
